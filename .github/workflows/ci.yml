name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: python -m pip install requests

      - name: 语种分类
        run: python tests/test_classify.py

      - name: 曲风标注
        run: python tests/test_genres.py

      - name: 歌单落点
        run: python tests/test_target.py
